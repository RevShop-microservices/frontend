name: CI/CD - Frontend

on:
  push:
    branches: [ "main", "master", "develop" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [ "main", "master", "develop" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install Dependencies
      working-directory: ./frontend
      run: |
        if [ -f package-lock.json ]; then
          npm ci
        else
          npm install
        fi

    - name: Run Linter
      working-directory: ./frontend
      run: npm run lint --if-present

    - name: Run Tests
      working-directory: ./frontend
      run: npm test -- --run

    - name: Build Application
      working-directory: ./frontend
      run: npm run build

    - name: Downcase repository owner
      id: downcase
      run: |
        echo "owner_lc=${OWNER,,}" >> ${GITHUB_OUTPUT}
      env:
        OWNER: "${{ github.repository_owner }}"

    - name: Set up Docker Buildx
      uses: actions/docker-setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        tags: |
          ghcr.io/${{ steps.downcase.outputs.owner_lc }}/frontend:latest
          ghcr.io/${{ steps.downcase.outputs.owner_lc }}/frontend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
